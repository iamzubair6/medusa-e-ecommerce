name: Keep Medusa warm

# ⚠️ Backup only. GitHub throttles scheduled workflows heavily — measured
# real-world cadence on this repo is ~every 2 HOURS despite the */10 cron,
# while Render sleeps after 15 idle minutes. The primary keep-warm is a free
# UptimeRobot monitor (reliable 5-min pings) — see docs/GO_LIVE_GUIDE.md.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Medusa exposes a built-in /health endpoint (verified: returns 200 "OK").
      # Any response wakes the Render dyno, so the step never fails the job.
      - name: Ping Medusa (Render)
        run: curl -s -o /dev/null -m 180 https://medusabd.onrender.com/health || true
      # /api/warm touches the Neon CMS DB (suspends after 5 idle minutes) and
      # re-checks Medusa from inside the app.
      - name: Warm storefront + Neon CMS DB
        run: curl -s -o /dev/null -m 60 https://medusa-e-ecommerce-web.vercel.app/api/warm || true
